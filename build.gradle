//-*- coding: utf-8-unix -*-
plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    maven {
        name = 'Central Portal Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        // Only search this repository for the specific dependency group
        content {
            includeGroup("se.laz.casual")
        }
    }
    mavenLocal()
}

apply from: "$rootProject.projectDir/versions.gradle"

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkiverse.ironjacamar:quarkus-ironjacamar:1.7.1'
    implementation 'io.quarkus:quarkus-arc'
    implementation libs.casual_api
    implementation libs.casual_inbound_api
    implementation libs.casual_inbound
    implementation libs.casual_inbound_handler_api
    implementation libs.casual_inbound_handler_casual_service
    implementation libs.casual_jca
    implementation libs.casual_network_protocol
    implementation libs.casual_network
    implementation libs.casual_internal
    implementation libs.netty
    implementation libs.netty_epoll
    implementation libs.commons_io
    implementation libs.casual_api_spi_impl

    runtimeOnly libs.gson

    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'
}

group = 'se.laz.casual'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters' << "-Werror"
}

compileTestJava {
    options.encoding = 'UTF-8'
}
