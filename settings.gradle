pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
        id 'io.quarkus.extension' version "${quarkusPluginVersion}"
        id 'org.kordamp.gradle.jandex' version '2.1.0'
    }
}
rootProject.name='casual-quarkus'

include 'runtime'
project(':runtime').name = 'quarkus-casual'

include 'deployment'
project(':deployment').name = 'quarkus-casual-deployment'

include 'example'
